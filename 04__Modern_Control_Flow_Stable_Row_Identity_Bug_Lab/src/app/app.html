<h2>Support Ticket</h2>
@if(loading){
  <p>Loading...</p>
} @else {
  @for(ticket of tickets; track ticket.id){
    <div>
      <h3>#{{ticket.id}} - {{ticket.title}}</h3>
      <input type="text" placeholder="Add local note" />
      <button (click)="deleteTicket(ticket.id)">Delete</button>
      <button (click)="moveUp(ticket.id)">Up</button>
      <button (click)="moveDown(ticket.id)">Down</button>
    </div>
  } @empty {
    <p>No support tickets found.</p>
  }
}

<router-outlet />
