<p>{{country()}}</p>
<ul>
  @for(city of cities(); track $index){
    <button (click)="selectCity(city)">{{city}}</button>
  }
</ul>
<button (click)="toggleCountry()">Toggle Country</button>
<p>Selected City : {{selectedCity()}}</p>
<p>Linked Selected City : {{linkedSelectedCity()}}</p>
<p>Advanced Linked Selected City : {{advancedLinkedSelectedCity()}}</p>
<router-outlet></router-outlet>
